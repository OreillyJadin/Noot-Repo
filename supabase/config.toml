# Supabase local dev config (ARCHITECTURE.md §3, §11).
# `supabase start` reads this. If your CLI version rejects a key, regenerate with
# `supabase init` in a scratch dir and merge — the [auth]/[db] core keys are stable.
project_id = "noot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# 17 to match the CLI's bundled Postgres (2.109 runs 17.6) and the cloud project.
major_version = 17

[studio]
enabled = true
port = 54323

# Local mailbox — magic links land here (http://localhost:54324), no real email sent.
# NOTE: use [inbucket], not [local_smtp]. CLI 2.109 accepts both (warns [inbucket] is
# deprecated) but the Supabase "Preview" GitHub check rejects [local_smtp] on push.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Where the magic-link redirect returns. Expo dev server default; add prod/app URLs later.
site_url = "http://localhost:8081"
# Magic-link returns to /auth-callback; the ** globs let any path/params through.
# `noot://**` is the one that matters in production — the app passes the deep link as
# emailRedirectTo, and if it isn't allow-listed GoTrue silently falls back to site_url.
# Cloud mirrors this in Dashboard → Auth → URL Configuration (separate from this file).
additional_redirect_urls = [
  "http://localhost:8081", "http://localhost:8081/**",
  "noot://", "noot://**",
  "https://trynoot.com", "https://trynoot.com/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local: no click-to-confirm; the magic-link OTP itself is the verification.
enable_confirmations = false

# Branded templates, kept as files so local and cloud can't drift. The cloud project is
# updated from these same files by `scripts/push_auth_templates.mts`.
[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your Noot sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your Noot password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You've been invited to Noot"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

# Stripe redirects the tutor's browser here after Connect onboarding (ERR-002); a browser
# carries no session, so this one function must run without JWT verification. It only
# redirects into the app — see supabase/functions/connect-return/index.ts.
[functions.connect-return]
verify_jwt = false
